# Images the core builds itself (lib/own_images.py, tools/build-images).
#
# A core service that runs code of this repository runs it from one of these images:
# never a stock image with the code mounted in, never a compose `build:`. Each entry
# names the Dockerfile, every file its build may read (the build context holds these
# and LICENSE, nothing else), the compose services that run it, and its license for the
# suite bill of materials. The compose files pin each image as
# `<name>:<VERSION>@sha256:<digest>`; tools/build-images builds, signs and pins it.
schema: papaia.own-images/1
images:
  - name: ghcr.io/fidonis/papaia-egress
    dockerfile: src/infra/egress/Dockerfile
    inputs:
      - src/infra/egress/Dockerfile
      - src/infra/egress/egress.py
      - src/infra/egress/THIRD_PARTY_LICENSES.md
    services: [papaia-egress]
    license: MIT
    license_class: P
  - name: ghcr.io/fidonis/papaia-lifecycle
    dockerfile: src/infra/lifecycle/Dockerfile
    inputs:
      - src/infra/lifecycle/Dockerfile
      - src/infra/lifecycle/lifecycle.py
      - src/infra/lifecycle/THIRD_PARTY_LICENSES.md
    services: [papaia-lifecycle]
    license: MIT
    license_class: P
  - name: ghcr.io/fidonis/papaia-audit
    dockerfile: src/infra/audit/Dockerfile
    inputs:
      - src/infra/audit/Dockerfile
      - src/infra/audit/requirements.txt
      - src/infra/audit/papaia_audit/__init__.py
      - src/infra/audit/papaia_audit/__main__.py
      - src/infra/audit/papaia_audit/access.py
      - src/infra/audit/papaia_audit/core.py
      - src/infra/audit/papaia_audit/idp.py
      - src/infra/audit/papaia_audit/read.py
      - src/infra/audit/papaia_audit/report.py
      - src/infra/audit/papaia_audit/retention.py
      - src/infra/audit/papaia_audit/siem.py
      - src/infra/audit/papaia_audit/watch.py
      - src/infra/audit/papaia_audit/audit.v1.schema.json
      - src/infra/audit/papaia_audit/schema.sql
      - src/infra/audit/papaia_audit/schema_read.sql
      - src/infra/audit/papaia_audit/schema_retention.sql
      - src/infra/audit/papaia_audit/schema_access.sql
      - src/infra/audit/papaia_audit/schema_siem.sql
      - src/infra/audit/THIRD_PARTY_LICENSES.md
    services: [papaia-audit, papaia-audit-schema]
    license: MIT
    license_class: P
  - name: ghcr.io/fidonis/papaia-people
    dockerfile: src/infra/people/Dockerfile
    inputs:
      - src/infra/people/Dockerfile
      - src/infra/people/people.py
      - src/infra/people/THIRD_PARTY_LICENSES.md
    services: [papaia-people]
    license: MIT
    license_class: P
  - name: ghcr.io/fidonis/papaia-docker-gate
    dockerfile: src/infra/docker-gate/Dockerfile
    inputs:
      - src/infra/docker-gate/Dockerfile
      - src/infra/docker-gate/docker_gate.py
      - src/infra/docker-gate/THIRD_PARTY_LICENSES.md
    services: [papaia-docker-gate]
    license: MIT
    license_class: P
