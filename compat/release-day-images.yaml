# Module images that are published only on the release day (lib/release_day.py,
# tools/check-image-pins; docs/compatibility.md, "Pinned images resolve").
#
# A module publishes its image from its own release tag on the release day; no module
# image is pushed to a remote registry before. Until then the compose and
# service-env.json pins name the candidate built from the module milestone, and each
# such image is listed here with that digest and the commit it was built from. Candidate
# mode reports a listed image as a release-day notice; release mode fails while this
# list has an entry. On the release day: publish, re-pin (tools/check-image-pins repin;
# papaia-me also with python -m lib.me_profile generate), and remove the entry.
schema: papaia.release-day-images/1
images:
  - image: ghcr.io/fidonis/papaia-me
    tag: 0.1.0
    digest: sha256:7d8e5165cbda151723d31d322e8cd6524bc9449f4372345a57cd3302f88d2c99
    module: papaia-me
    source: 4d9b1a13750678eda10a47452ae7f4ae06f60cea
    built: 2026-11-20
  - image: ghcr.io/fidonis/papaia-connections
    tag: 0.1.0
    digest: sha256:ad0b8201f34c081baca32e7c841f3859b9ac9b98c0a70154bd55b3091bd75aa5
    module: papaia-connections
    source: 82e61778d116e313ebcecc1bfc6a6362f7640238
    built: 2026-11-23
  # The manager's runtime base is not pinned by digest: its published digest will
  # differ from this candidate, so it is re-pinned on the release day.
