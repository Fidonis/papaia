# Kit versions of the candidate suite: the field `kit` of the suite bill of materials
# (papaia.suite-bom/1) for every repo of the candidate row of compat/suite.yaml.
#
# `version` is the kit release the repo vendors (its kit.lock); `renders_ui` says
# whether the repo renders kit UI. The core, the connection register, the add-ons and
# the MCP servers render none: for them the kit's visual rule does not apply, its
# matrix and major-version rules still do. The bill of materials of the suite copies
# these fields unchanged. CI runs the kit's suite check over this file:
#
#   cd tools && uv run --locked --extra dev pk-check bom ../compat/suite-kit.yaml
#
# `kit_build` names the build the repo vendors: version, commit and the sha256 of the kit
# wheel. One kit version can have been built from more than one commit, so the version
# alone does not tell builds apart. Every entry on the release names its release build
# record. qdrant-mcp-rbac still vendors the internal cut 0.1.1, which is not a release of
# the kit's matrix: its entry names that build and carries no `kit` field, so the suite
# check does not claim a release for it until it binds the release.
#
# The entry of the core must name the release in tools/kit.lock, and the kit entry the
# same release and its commit (tools/tests/test_kit_vendor.py). docs/compatibility.md
# explains the file.
schema: papaia.suite-bom/1
suite: 1.10.0
repos:
  - name: papaia
    role: core
    kit:
      version: 0.1.0
      renders_ui: false
    kit_build:
      version: 0.1.0
      commit: 849e344064472d94a5c934170f58162ef296c94c
      wheel_sha256: 7ecccf90d47cce795a5b07712f9f4806839dcd0211aba71bf2f16eb6e7b1211e
