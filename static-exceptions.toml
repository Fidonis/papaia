# Exceptions of the core from `papaia-kit conformance static` (CI job `static`).
#
# The suite reads the code that runs on an installation (tools/lib, tools/migrations,
# src) and fails on code execution, query text assembled at runtime, `aud-` scopes
# built outside the kit and hard-coded model names. Each entry below excepts exactly
# one place: rule, file, the function or class it is in (`within`), the reported
# subject and, for more than one finding there, their `count`. A new finding
# elsewhere, or one more at the same place, fails; so does an entry that no longer
# matches or has expired. The format is described in the kit
# (contract/conformance.md, "Exception list").
#
# `input` says where the excepted value comes from: `fixed` (literals of this
# repository and values the code derives from them) or `operator-config` (the
# configuration of the installation and the arguments the operator passes to
# papaia-ctl). A value a person, an event or a model feeds at runtime is never
# excepted. None of the excepted calls uses a shell for a value: every command is an
# argument list, and the two `sh -c` scripts are literals that take their one value
# through an environment variable or a path fixed in the code.
#
# Exchange scopes have no entry: they are built through the kit (lib/kit_names.py).
#
# The CI job runs with `--require-approved`: an entry passes only once the security
# officer has countersigned it (approved_by names the security officer and no longer
# says pending).

version = 1

