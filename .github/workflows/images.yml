name: Core images

# Builds every own image of compat/own-images.yaml for linux/amd64 and linux/arm64,
# scans each platform of the built digest and keeps the CycloneDX SBOMs. A version tag
# also signs: the publish job rebuilds, checks that the digests are the pinned (and
# so the scanned) ones, signs them with this workflow's identity and attaches the
# SBOMs as cosign attestations (docs/compatibility.md, "Own images of the core").
# Every pin of the core must resolve in a registry (tools/check-image-pins,
# docs/compatibility.md, "Pinned images resolve"): on a milestone branch in candidate
# mode against the images built here, on demand in release mode before a tag, and on a
# tag in release mode once the own images are published.

on:
  pull_request:
    branches: [main, "releases/**"]
  push:
    branches: [main, "releases/**"]
    tags: ["v*"]
  # The vulnerability databases change daily: scan the build of the default branch again.
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      pin-check:
        description: "Pin check of this run: release (before a tag) or none"
        type: choice
        options: [none, release]
        default: none

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.12"
  # BuildKit v0.34.2; the docker-container builder needs the host network for the
  # registry of the scan job.
  BUILDKIT_IMAGE: "moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe"
  # Images of the scan job are pushed here only; the prefix marks them unpublished.
  SCAN_REGISTRY: "localhost:5000/unpublished/"

jobs:
  build-scan:
    name: Build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            network=host
            image=${{ env.BUILDKIT_IMAGE }}
      - name: Check the declaration, the Dockerfiles and the pins
        working-directory: tools
        run: uv run --locked --extra dev python -m lib.own_images check
      - name: Check the exception file
        working-directory: tools
        run: uv run --locked --extra dev python -m lib.image_scan check
      # Self test: the gate must fail a report with a critical finding and name it, so a
      # gate that stopped gating fails here.
      - name: Seeded critical finding fails the gate
        working-directory: tools
        run: |
          report=tests/fixtures/trivy/seeded-critical.json
          artifact=$(jq -r .ArtifactName "$report")
          status=0
          uv run --locked --extra dev python -m lib.image_scan gate \
            --report "$report" --artifact "$artifact" > ../seeded-gate.txt 2>&1 || status=$?
          cat ../seeded-gate.txt
          if [[ "${status}" -ne 1 ]] || ! grep -q "CVE-2099-0001" ../seeded-gate.txt; then
            echo "the seeded critical finding was not rejected (exit ${status})" >&2
            exit 1
          fi
          echo "seeded critical finding rejected as expected"
      - name: Build both platforms into the job's registry
        working-directory: tools
        run: >-
          uv run --locked --extra dev python -m lib.own_images build
          --registry "${SCAN_REGISTRY}" --out "${RUNNER_TEMP}/builds.json"
      # The build is reproducible, so it gives the pinned digests unless an input changed
      # without a rebuild and pin. A tag signs only the pinned digests: there it fails.
      - name: Compare the built digests with the compose pins
        working-directory: tools
        run: |
          if uv run --locked --extra dev python -m lib.own_images verify \
            --builds "${RUNNER_TEMP}/builds.json"; then
            exit 0
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            exit 1
          fi
          echo "::warning::the built digests differ from the compose pins; rebuild and pin before the release"
      - name: Scan every platform of every built digest
        working-directory: tools
        run: >-
          uv run --locked --extra dev python -m lib.image_scan scan
          --builds "${RUNNER_TEMP}/builds.json" --out "${RUNNER_TEMP}/scan"
          --cache "${RUNNER_TEMP}/trivy-cache"
      - name: Collect the builds file, reports and SBOMs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p images-report
          cp "${RUNNER_TEMP}/builds.json" images-report/ 2>/dev/null || true
          cp "${RUNNER_TEMP}"/scan/*.json images-report/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: images-report
          path: images-report/
          retention-days: 90
      # A pin that no registry serves stops every installation at its start. On a
      # milestone branch the own images are the ones built above (the job's registry);
      # every other pin must already be served by its registry.
      - name: Every pin resolves (candidate mode)
        if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/releases/') }}
        working-directory: tools
        run: >-
          uv run --locked --extra dev python -m lib.image_pins check
          --mode=candidate --registry="${SCAN_REGISTRY}"
      # Before a tag: everything published except the own images, which the tag run
      # publishes; they must be the reproducible build of this run.
      - name: Every pin resolves (release mode, before the tag)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.pin-check == 'release' }}
        working-directory: tools
        run: >-
          uv run --locked --extra dev python -m lib.image_pins check
          --mode=release --own-builds="${RUNNER_TEMP}/builds.json"

  publish:
    name: Sign and attest (tag)
    needs: build-scan
    # Publishing is switched on by the maintainer with the repository variable
    # PAPAIA_PUBLISH_IMAGES once the release registry is decided.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PAPAIA_PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the version of the checkout
        run: |
          version=$(cat VERSION)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not name VERSION ${version}" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-report
          path: images-report
      - name: Build both platforms into the release registry
        working-directory: tools
        run: >-
          uv run --locked --extra dev python -m lib.own_images build
          --out "${RUNNER_TEMP}/builds.json"
      # Same digests as the compose pins, which the scan job checked against its build:
      # only scanned bytes are signed.
      - name: The release digests are the pinned and scanned ones
        working-directory: tools
        run: >-
          uv run --locked --extra dev python -m lib.own_images verify
          --builds "${RUNNER_TEMP}/builds.json"
      - name: Sign each digest and attest its SBOMs
        working-directory: tools
        run: >-
          uv run --locked --extra dev python -m lib.own_images sign-keyless
          --builds "${RUNNER_TEMP}/builds.json" --sboms ../images-report

  release-pins:
    name: Every pin resolves (tag)
    needs: publish
    # The tag is complete only when every pin, the own images just pushed included,
    # resolves in the release registry. Read access only: no login, no token.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every pin resolves (release mode)
        working-directory: tools
        run: uv run --locked --extra dev python -m lib.image_pins check --mode=release
