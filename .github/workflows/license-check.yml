name: License check

on:
  push:
    branches: [main]
    paths:
      - "src/**/docker-compose.yml"
      - "THIRD_PARTY_LICENSES.md"
  pull_request:
    branches: [main]
    paths:
      - "src/**/docker-compose.yml"
      - "THIRD_PARTY_LICENSES.md"

jobs:
  image-inventory-check:
    name: Verify image inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify all images in the compose files are documented
        run: |
          set -euo pipefail

          doc_file="THIRD_PARTY_LICENSES.md"

          if [ ! -d src ]; then
            echo "ERROR: src/ not found"
            exit 1
          fi
          if [ ! -f "$doc_file" ]; then
            echo "ERROR: $doc_file not found"
            exit 1
          fi

          # Image references are pinned inline in each service's compose file.
          # The tag or digest is stripped so a version bump does not have to be
          # matched literally here; the repository name is what this job gates.
          mapfile -t images < <(
            find src -name docker-compose.yml -print0 \
              | xargs -0 grep -hoP '^\s*image:\s*\K\S+' \
              | sed -E 's/@sha256:.*$//; s/:[^:/]+$//' \
              | sort -u
          )

          if [ ${#images[@]} -eq 0 ]; then
            echo "ERROR: no image references found under src/ — the extraction is broken."
            exit 1
          fi

          missing=()
          for image in "${images[@]}"; do
            if ! grep -qF "\`$image\`" "$doc_file"; then
              missing+=("$image")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "The following images are not documented in $doc_file:"
            for image in "${missing[@]}"; do
              echo "  - $image"
            done
            echo ""
            echo "Add an entry for each image to $doc_file before merging."
            exit 1
          fi

          echo "OK — all ${#images[@]} image(s) are documented in $doc_file."
