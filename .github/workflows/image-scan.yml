name: Image scan

on:
  pull_request:
    branches: [main, "releases/**"]
    paths: ["src/**", ".github/workflows/image-scan.yml"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-images:
    name: List images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The own images of compat/own-images.yaml are built, scanned and gated on the
      # built digest by images.yml; this workflow lists every other pinned image, the
      # module images the core pins (papaia-me, papaia-connections, ...) included.
      - name: Read the pinned images from the compose files
        id: list
        run: |
          own=$(grep -oP '^\s*- name:\s*\K\S+' compat/own-images.yaml | sed 's/$/:/')
          images=$(grep -rhoP '^\s*image:\s*\K\S+' src --include='docker-compose*.yml' \
            | grep -vF "${own}" \
            | sort -u | jq -Rcs 'split("\n") | map(select(length > 0))')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.image }}
    needs: list-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.list-images.outputs.images) }}
    steps:
      - name: Name the report
        id: report
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=$(printf '%s' "$IMAGE" | tr '/:@' '---')" >> "$GITHUB_OUTPUT"
      - name: Write the full report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy-${{ steps.report.outputs.name }}.json
          exit-code: "0"
          timeout: 10m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-${{ steps.report.outputs.name }}
          path: trivy-${{ steps.report.outputs.name }}.json
          retention-days: 90
      # An upstream image is fixed by a new upstream tag, so its fixable critical findings
      # are listed here and kept in the report without failing the job.
      - name: List fixable critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          timeout: 10m
