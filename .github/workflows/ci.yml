name: CI

on:
  push:
    branches: [main, "releases/**"]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.12"
  YAMLLINT_VERSION: "1.38.0"
  # hadolint v2.12.0
  HADOLINT_IMAGE: "hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz; change it together with the version.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint-shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck --severity=warning

  lint-yaml:
    name: Yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run yamllint
        run: uvx "yamllint==${YAMLLINT_VERSION}" .

  lint-docker:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hadolint on every Dockerfile
        run: |
          mapfile -d '' files < <(git ls-files -z -- '*Dockerfile')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no Dockerfile found"
            exit 0
          fi
          status=0
          for file in "${files[@]}"; do
            echo "hadolint ${file}"
            docker run --rm -i --network none "${HADOLINT_IMAGE}" \
              hadolint --ignore DL3008 --ignore DL3013 - < "${file}" || status=1
          done
          exit "${status}"

  test-python:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    # A hanging gateway container must not hold the runner for the default six hours.
    timeout-minutes: 20
    env:
      # The golden snapshot compares `docker compose config` only on the Compose release it
      # was recorded with; in CI a missing or different Compose fails instead of skipping.
      PAPAIA_REQUIRE_GOLDEN_COMPOSE: "1"
      # The suite signature tests need openssl; in CI its absence fails instead of skipping.
      PAPAIA_REQUIRE_OPENSSL: "1"
      # The secret scan tests need gitleaks; in CI its absence fails instead of skipping.
      PAPAIA_REQUIRE_GITLEAKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      # The runner image ships another Compose release than the one the golden snapshot
      # records; install that one, verified against its published checksum.
      - name: Provide the Compose release of the golden snapshot
        run: |
          version=$(python3 -c 'import json; print(json.load(open("tools/tests/golden/single-node.json"))["default"]["compose"]["version"])')
          asset="docker-compose-linux-x86_64"
          base="https://github.com/docker/compose/releases/download/v$version"
          mkdir -p "$HOME/.docker/cli-plugins"
          cd "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o "$asset.sha256" "$base/$asset.sha256"
          sha256sum -c "$asset.sha256"
          mv "$asset" docker-compose
          rm "$asset.sha256"
          chmod +x docker-compose
          docker compose version
      # The live link tests need the HAProxy the gateway ships: the distribution's is too old
      # for `timeout client-hs`. Its Alpine binary runs here only inside the image.
      - name: Provide the pinned HAProxy
        run: |
          image=$(sed -n 's/^ *image: \(haproxy:.*\)$/\1/p' src/infra/link-gateway/docker-compose.yml)
          docker pull "$image"
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/haproxy" <<EOF
          #!/bin/sh
          exec docker run --rm --init --network host --user $(id -u):$(id -g) -v /tmp:/tmp $image haproxy "\$@"
          EOF
          chmod +x "$HOME/.local/bin/haproxy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Provide the pinned gitleaks
        run: .github/scripts/install-gitleaks.sh
      - name: Run ruff
        working-directory: tools
        run: uv run --locked --extra dev python -m ruff check lib tests
      - name: Run pytest
        working-directory: tools
        run: uv run --locked --extra dev python -m pytest tests/ -rs

  licenses:
    name: License check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      # Every locked package must be installed for the check to read its license metadata.
      - name: Sync the locked environment
        working-directory: tools
        run: uv sync --locked --extra dev
      - name: Locked dependencies and base images against the kit's license policy
        working-directory: tools
        run: >-
          uv run --locked --extra dev papaia-kit licenses check
          --python-project .
          --records ../licenses/base-images.json
          --exceptions ../license-exceptions.toml
          --report ../licenses-report.json
      # Self test: the same check must reject a dependency under a forbidden license and
      # name it, so a check that stopped checking fails here.
      - name: Seeded forbidden license fails the check
        if: ${{ !cancelled() }}
        working-directory: tools
        run: |
          status=0
          uv run --locked --extra dev papaia-kit licenses check \
            --python-project . \
            --records ../licenses/base-images.json \
            --records tests/fixtures/licenses/seeded-forbidden.json \
            --exceptions ../license-exceptions.toml > ../seeded-license.txt 2>&1 || status=$?
          cat ../seeded-license.txt
          if [[ "${status}" -ne 1 ]] || ! grep -q "seeded-forbidden-license 1.0.0" ../seeded-license.txt; then
            echo "the seeded forbidden license was not rejected (exit ${status})" >&2
            exit 1
          fi
          echo "seeded forbidden license rejected as expected"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: licenses-report
          path: licenses-report.json
          retention-days: 30

  words:
    name: Word check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      # Existing product vocabulary is frozen in words-baseline.toml with its location; a
      # hit that is not listed, or a listed hit that disappeared, fails.
      - name: Denied terms in tracked files against the frozen baseline
        run: >-
          uv run --locked --extra dev --project tools papaia-kit repo words
          --root . --baseline words-baseline.toml

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false
      - name: Provide the pinned gitleaks
        run: .github/scripts/install-gitleaks.sh
      # Reviewed findings of the history are listed in .gitleaksignore with their reason.
      - name: Scan the repository history
        run: >-
          gitleaks git --redact --verbose --exit-code 1
          --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore .

  pr-title:
    name: Conventional Commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
