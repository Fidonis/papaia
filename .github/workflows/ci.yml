name: CI

on:
  push:
    branches: [main, "releases/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

  lint-yaml:
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: pip install --user yamllint
      - name: Run yamllint
        run: yamllint .

  lint-docker:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for Dockerfiles
        id: dockerfiles
        run: |
          count=$(find . -name "Dockerfile" | wc -l)
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Run hadolint
        if: steps.dockerfiles.outputs.found == 'true'
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          dockerfile: "Dockerfile"
          ignore: DL3008,DL3013

  test-python:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # The live link tests need the HAProxy the gateway ships: the distribution's is too old
      # for `timeout client-hs`. Its Alpine binary runs here only inside the image.
      - name: Provide the pinned HAProxy
        run: |
          image=$(sed -n 's/^ *image: \(haproxy:.*\)$/\1/p' src/infra/link-gateway/docker-compose.yml)
          docker pull "$image"
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/haproxy" <<EOF
          #!/bin/sh
          exec docker run --rm --init --network host --user $(id -u):$(id -g) -v /tmp:/tmp $image haproxy "\$@"
          EOF
          chmod +x "$HOME/.local/bin/haproxy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run ruff
        working-directory: tools
        run: uv run --frozen --extra dev python -m ruff check lib tests
      - name: Run pytest
        working-directory: tools
        run: uv run --frozen --extra dev python -m pytest tests/ -rs

  pr-title:
    name: Conventional Commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
