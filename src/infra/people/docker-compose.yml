# ═══════════════════════════════════════════════════════════════════════════
# papAIa — People lookup · papaia-people
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
#
# OPTIONAL — profile `people` (docs/people.md). Needs the bundled Keycloak
# (profile `keycloak`); the realm sync sets up the service account
# svc-papaia-people and the audience papaia-people while the profile is active.
#
# What it does: answers GET /v1/people/lookup?q=<full name or mail>&role=<role>
# for the assistant's gate (assist-gate) with {sub, display_name} of the persons
# whose whole display name or mail is q and who hold the assistant role. No
# partial search, no list of the directory; 30 requests per person and 10 min;
# one papaia.audit/1 row per request on stdout, never the search text.
# For Studio's share notices it answers GET /v1/people/group-members?group=<id>
# for papaia-studio-gateway with the sub of at most 50 active members holding
# a Studio role, else {too_many: true}; only groups that platform/groups.json
# offers for sharing.
#
# Safety:
#   - No port is published. It is reached on the stack network as
#     http://papaia-people:8080 by a client that holds a token for papaia-people.
#   - Every request carries a person token of the realm for the audience
#     papaia-people, issued to assist-gate (lookup) or papaia-studio-gateway
#     (group members); the service checks signature, issuer, audience, client,
#     route and lifetime itself.
#   - Signs in with private_key_jwt; the key is mounted read-only from
#     $PAPAIA_CONFIG_DIR/security/service-accounts/svc-papaia-people. The account
#     holds realm-management query-users, view-users and query-groups, no write
#     right. The group list is mounted read-only from $PAPAIA_CONFIG_DIR/platform.
#   - Keeps no state and no volume. Runs as the user that owns the config dir,
#     read-only, without capabilities.
#
# Variable paths (docs/configuration.md): ${VAR} below resolves from src/.env.
services:

  papaia-people:
    # The core's own image (Dockerfile next to this file, compat/own-images.yaml): one
    # standard-library Python file on a pinned Python base, which brings the openssl
    # command line (ES256). Built, signed and pinned by tools/build-images.
    image: ghcr.io/fidonis/papaia-people:1.9.0@sha256:341fc71daa287ee731ba9f2f93f9e79a4cf7f270a0b1fbcfbf506cd364df3b33
    restart: unless-stopped
    command:
      - python3
      - -I
      - /opt/papaia-people/people.py
      - run
      - --keycloak-url=https://keycloak:8443
      - --issuer=${OIDC_ISSUER}
      - --ca-file=/etc/papaia-people/local-ca.crt
      - --account-dir=/run/papaia-people/account
      - --groups-file=/run/papaia-people/platform/groups.json
      - --listen=0.0.0.0:8080
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/certs/local-ca.crt
        target: /etc/papaia-people/local-ca.crt
        read_only: true
        bind:
          create_host_path: false
      # The folder, not the file: a rotation replaces the key file atomically.
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/security/service-accounts/svc-papaia-people
        target: /run/papaia-people/account
        read_only: true
        bind:
          create_host_path: false
      # The folder, not the file: the realm sync replaces groups.json atomically.
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/platform
        target: /run/papaia-people/platform
        read_only: true
        bind:
          create_host_path: false
    # openssl reads the message it signs from a file.
    tmpfs:
      - /tmp:size=1m,mode=1777
    read_only: true
    healthcheck:
      test: [CMD, python3, -I, /opt/papaia-people/people.py, health, --port=8080]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - papaia-net
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels:
      de.fidonis.module: papaia-people
      de.fidonis.role:   people-lookup
    profiles: [people]
