# Expose /health/ready on the management port (9000) — used by the
# Docker healthcheck and bootstrap.sh (via docker exec, not host port).
health-enabled=true
http-management-health-enabled=true

# HTTP on port 8080 — kept for internal bootstrap / debugging access.
http-enabled=true

# HTTPS on port 8443 — cert paths are injected via KC_HTTPS_CERTIFICATE_FILE
# and KC_HTTPS_CERTIFICATE_KEY_FILE environment variables in docker-compose.yml.
https-enabled=true

# Keep management interface (port 9000) on plain HTTP so the Docker healthcheck
# (which uses /dev/tcp, not TLS) continues to work even with HTTPS enabled.
http-management-scheme=http

# Accept requests regardless of the Host header value.
# Needed because KC_HOSTNAME uses host.docker.internal / IP but requests
# may arrive via different hostnames (e.g. localhost, reverse proxy).
hostname-strict=false
