# papAIa login theme. Assigned per client (attribute `login_theme`), never to the
# realm: a login started by a papAIa service is branded, a direct Keycloak login
# (e.g. the account console) keeps the stock look.
#
# The kit's login theme (tools/kit_snapshot.py copies its resources: token values,
# stylesheet, fonts) loads first, in the kit's order; the brand layer css/papaia.css
# (logo, rebranding through the overlay) last. Values only through var(--pk-*).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/tokens.css css/papaia-login.css css/papaia.css
