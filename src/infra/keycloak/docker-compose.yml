# Log rotation for every service (json-file, at most 5 x 10 MiB per container; README
# "Logs and log rotation").
x-papaia-logging: &papaia-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  keycloak:
    logging: *papaia-logging
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    restart: unless-stopped
    # No host port: browsers reach Keycloak through the edge proxy, the stack's services
    # and the admin steps of papaia-ctl on the stack network (keycloak:8443). Direct port
    # access (no_proxy) publishes it through the generated direct-ports override.
    volumes:
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/infra/keycloak/keycloak.conf
        target: /opt/keycloak/conf/keycloak.conf
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/infra/keycloak/realm-import
        target: /opt/keycloak/data/import
      # Login theme of the papAIa clients (client attribute login_theme); rendered
      # from the repo, replaceable through the overlay.
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/infra/keycloak/themes/papaia
        target: /opt/keycloak/themes/papaia
        read_only: true
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/certs
        target: /opt/keycloak/conf/certs
        read_only: true
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_URL: jdbc:postgresql://keycloak-postgres/keycloak
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      # TLS certificate for the internal HTTPS listener (port 8443).
      # Cert is generated by papaia-ctl setup and bind-mounted from $PAPAIA_CONFIG_DIR/certs/.
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/keycloak.key
      # Trust X-Forwarded-* headers from the edge proxy. Without this Keycloak
      # treats the request as plain HTTP and drops cookies "Secure" → cross-
      # origin OIDC POSTs lose state and login fails. Set KC_PROXY_HEADERS
      # to empty if you ever expose Keycloak directly without a reverse proxy.
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}
      # Client secrets are NOT passed in here. Keycloak's native ${env.VAR}
      # substitution at realm-import time proved unreliable, so the secrets are
      # baked into the realm JSON beforehand by render_core.bake_realm_secrets(),
      # which reads them straight from infra/keycloak/.env.
    # --import-realm: imports realm-import/*.json on first start (skipped if realm exists)
    command: start --import-realm
    networks:
      - papaia-net
      # Shared with papaia-lifecycle alone (profile `lifecycle`); internal.
      - papaia-lifecycle-net
      # Shared with papaia-audit alone (permission report); internal.
      - papaia-audit-idp-net
    labels:
      de.fidonis.module: papaia-keycloak
      de.fidonis.role:   identity-provider
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    profiles: [keycloak]

  keycloak-postgres:
    logging: *papaia-logging
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-postgresql:/var/lib/postgresql
    networks:
      - papaia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U ${KC_DB_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10
    labels:
      de.fidonis.module: papaia-keycloak
      de.fidonis.role:   database
    profiles: [keycloak]

# Volumes mounted on Windows: \\wsl.localhost\docker-desktop\mnt\docker-desktop-disk\data\docker\volumes
# Volumes mounted on Linux: /var/lib/docker/volumes
volumes:
  keycloak-postgresql:
