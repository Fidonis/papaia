# ═══════════════════════════════════════════════════════════════════════════
# papAIa — Personal area · me-web
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
#
# OPTIONAL — activate with profile `me`:
#   COMPOSE_PROFILES=...,me   OR   papaia-ctl setup --me [--me-host=URL]
#
# One place where every person sees and changes their own settings in the
# modules of the installation, and sees what the platform keeps about them
# (docs/personal-settings-contract.md, ADR 0015). The area stores no values:
# each module keeps its own and answers the module API. me-web only reads the
# rendered registry, signs the person in as the confidential client papaia-me
# and exchanges the person's token per module for one with that module's
# audience only. No database, no Docker socket, no configuration tree beyond
# the registry.
#
# Reaching the modules: core modules on papaia-net directly; an add-on lists
# `me-web` under `networks.attach` (addon_api 4) so its API is reachable.
services:
  me-web:
    image: ghcr.io/fidonis/papaia-me:0.1.0
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # ME_OIDC_CLIENT_SECRET and ME_SESSION_SECRET come only through env_file
      # (environment: wins over env_file, so naming them here would blank them).
      AUTH_PROVIDER:         ${AUTH_PROVIDER}
      OIDC_ISSUER:           ${OIDC_ISSUER}
      # Browser-side authorization URL; token and keys on the internal name.
      OIDC_AUTH_URL:         ${OIDC_AUTH_URL}
      OIDC_TOKEN_URL:        ${OIDC_TOKEN_URL}
      OIDC_JWKS_URL:         ${OIDC_JWKS_URL}
      # Fixed: the realm template and the client policies depend on it.
      ME_OIDC_CLIENT_ID:     papaia-me
      ME_PUBLIC_URL:         ${ME_PUBLIC_URL}
      ME_REGISTRY_FILE:      /registry/registry.yaml
      # Trust the local CA cert generated by papaia-ctl setup. Cleared to "" via
      # docker-compose.ssl-cert.override.yml when AUTH_PROVIDER=external_oidc.
      SSL_CERT_FILE:         /certs/local-ca.crt
      # Module calls (contract "Transport"): the public CA files modules place next to
      # the registry, and the platform profile; under kritis no module is called over
      # plain http.
      ME_MODULE_CA_DIR:      /registry/module-ca
      PAPAIA_SECURITY_PROFILE: ${PAPAIA_SECURITY_PROFILE:-standard}
    ports:
      - "${HOST_IP:-0.0.0.0}:${ME_EXT_PORT:-8130}:8000"
    volumes:
      # The rendered registry, read-only: the area never changes a declaration.
      - ${PAPAIA_CONFIG_DIR}/personal-settings:/registry:ro
      - ${PAPAIA_CONFIG_DIR}/certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-me
      de.fidonis.role:   personal-area
    profiles: [me]
