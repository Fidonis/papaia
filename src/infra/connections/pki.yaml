# The certificate the connection registry requests from the platform PKI (docs/pki.md,
# contract papaia.platform-pki/1): a server certificate for https://connections:8080.
# Its callers present client certificates of the same CA (mutual TLS); its audit rows go
# to papaia-audit with a certificate of the audit ingest CA instead (docs/audit.md).
# Issued while the profile `connections` is on, into
# $PAPAIA_CONFIG_DIR/pki/core/connections/, readable by the image's user 10001.
profile: connections
pki:
  services:
    - name: connections
      uid: 10001
      server:
        dns: [connections]
