# ═══════════════════════════════════════════════════════════════════════════
# papAIa — Audit store · papaia-audit
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
#
# ALWAYS ON — profile `audit`; `papaia-ctl setup` keeps it in COMPOSE_PROFILES.
#
# The one place that keeps `papaia.audit/1` events (docs/audit.md). Every module and
# server delivers its events to https://papaia-audit:8443/v1/ingest over mutual TLS;
# papaia-audit takes the source from the client certificate and appends the event to
# that source's hash chain in papaia-audit-db.
#
# Safety:
#   - No port is published. papaia-audit-db is only on papaia-audit-net (internal);
#     sources reach papaia-audit only on papaia-audit-ingest-net (internal).
#   - Client certificates come from the ingest CA that `papaia-ctl` keeps in
#     $PAPAIA_CONFIG_DIR/infra/audit/pki; a certificate counts only while its
#     fingerprint is listed for its source in service/sources.json.
#   - The service logs in as audit_ingest (may only call audit.append) and audit_read
#     (may only read). The owner's password is used only by the database container and
#     by the one-shot papaia-audit-schema, which creates the store and sets the role
#     passwords; the service never holds it.
#   - Retention (role audit_retention, only audit.prune) shortens a chain only at its
#     start and never past a deletion lock or an event a SIEM target has not taken.
#   - The permission report (POST /v1/access-reports/build) is built here: the realm is
#     read as svc-papaia-audit-report (realm-management view-users only, GET only) on
#     papaia-audit-idp-net (internal, shared with Keycloak alone); its key is mounted
#     read-only from $PAPAIA_CONFIG_DIR/security/service-accounts/svc-papaia-audit-report
#     into this service alone. The inputs file service/access-report-inputs.json and
#     service/keycloak-ca.crt (the local CA certificate, to check Keycloak's TLS) come
#     with the service folder; papaia-ctl writes both on realm sync and start.
#   - The only way out is the SIEM export through papaia-egress (generated override,
#     only while PAPAIA_AUDIT_SIEM_TARGET is set); the signed chain heads go to
#     $PAPAIA_BACKUP_DIR/audit-heads, the one folder of the backup target it sees.
#   - papaia-audit and papaia-audit-schema run the core's own image
#     ghcr.io/fidonis/papaia-audit; nothing of the checkout is mounted.
#   - Runs as the user that owns the config dir, read-only, without capabilities. It
#     sees the database volume read-only and only for its fill level.
#
# Variable paths (docs/configuration.md): ${VAR} below resolves from src/.env.
# Log rotation for every service (json-file, at most 5 x 10 MiB per container; README
# "Logs and log rotation").
x-papaia-logging: &papaia-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  papaia-audit-db:
    logging: *papaia-logging
    image: postgres:17.12-alpine3.24@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/audit_db_owner_password
    # Only the owner's password; papaia-audit-schema creates the store and the roles.
    secrets:
      - audit_db_owner_password
    volumes:
      - papaia-audit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d audit -U audit_owner"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - papaia-audit-net
    security_opt: [no-new-privileges:true]
    labels:
      de.fidonis.module: papaia-audit
      de.fidonis.role:   database
    profiles: [audit]

  # One shot before the service: creates the store (schema.sql in the image) on an
  # empty database and sets the service role passwords. The only holder of the owner's
  # password besides the database.
  papaia-audit-schema:
    logging: *papaia-logging
    image: ghcr.io/fidonis/papaia-audit:1.10.0-rc.1@sha256:178e0d6f240f2441c36da4ba129cf1dfc23283acc21387f708110fbf4c73dff1
    restart: "no"
    user: "${UID:-1000}:${GID:-1000}"
    command: ["schema"]
    secrets:
      - audit_db_owner_password
      - audit_db_ingest_password
      - audit_db_read_password
      - audit_db_retention_password
      - audit_db_hold_password
    read_only: true
    depends_on:
      papaia-audit-db:
        condition: service_healthy
    networks:
      - papaia-audit-net
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels:
      de.fidonis.module: papaia-audit
      de.fidonis.role:   init
    profiles: [audit]

  papaia-audit:
    logging: *papaia-logging
    # The core's own image (Dockerfile next to this file, compat/own-images.yaml).
    # Built, signed and pinned by tools/build-images.
    image: ghcr.io/fidonis/papaia-audit:1.10.0-rc.1@sha256:178e0d6f240f2441c36da4ba129cf1dfc23283acc21387f708110fbf4c73dff1
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: ["serve"]
    environment:
      # Retention in months (6 to 36) and the SIEM export (docs/audit.md); checked at
      # start, a malformed value stops the service.
      PAPAIA_AUDIT_RETENTION_MONTHS: ${PAPAIA_AUDIT_RETENTION_MONTHS:-12}
      PAPAIA_AUDIT_SIEM_TARGET: ${PAPAIA_AUDIT_SIEM_TARGET:-}
      PAPAIA_AUDIT_SIEM_PEN: ${PAPAIA_AUDIT_SIEM_PEN:-32473}
      PAPAIA_AUDIT_SIEM_IDENTITY: ${PAPAIA_AUDIT_SIEM_IDENTITY:-pseudonym}
      PAPAIA_AUDIT_SIEM_BASIS: ${PAPAIA_AUDIT_SIEM_BASIS:-}
      # The permission report reads the realm as svc-papaia-audit-report (idp.py).
      PAPAIA_AUDIT_KEYCLOAK_URL: https://keycloak:8443
      # A copy of the local CA certificate in the service folder (realm sync writes it).
      PAPAIA_AUDIT_KEYCLOAK_CA: /etc/papaia-audit/keycloak-ca.crt
      PAPAIA_AUDIT_REPORT_ACCOUNT_DIR: /run/papaia-audit/report-account
      # The warning mail (relay, operations address and sender) comes from the generated
      # SIEM override, only with a target, PAPAIA_OPERATIONS_MAIL and the smtp profile.
    secrets:
      - audit_db_ingest_password
      - audit_db_read_password
      - audit_db_retention_password
      - audit_db_hold_password
      - audit_heads_key
      - audit_pseudonym_key
    volumes:
      # Server certificate and key, the ingest CA certificate, sources.json and
      # token-keys.json (the realm's signing keys for the read API). The
      # directory, not the files: sources.json is replaced atomically when a source
      # certificate is issued, and a bind-mounted file would keep showing the old one.
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/infra/audit/service
        target: /etc/papaia-audit
        read_only: true
        bind:
          create_host_path: false
      # The key of svc-papaia-audit-report, mounted into this service alone. The
      # folder, not the file: a rotation replaces the key file atomically. `papaia-ctl`
      # makes the key pair before the start; Compose must not create the folder.
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/security/service-accounts/svc-papaia-audit-report
        target: /run/papaia-audit/report-account
        read_only: true
        bind:
          create_host_path: false
      # The signed chain heads, appended every hour, at the backup target (K-15).
      # `papaia-ctl` creates the folder once; Compose must not, so an unmounted target
      # stops the start instead of taking the heads on the host's own disk.
      - type: bind
        source: ${PAPAIA_BACKUP_DIR}/audit-heads
        target: /var/lib/papaia-audit/heads
        bind:
          create_host_path: false
      # The database volume, read-only and only for its fill level (statvfs): the 95 %
      # warning mail. PostgreSQL keeps its root owned by the database user, mode 0700
      # or 0750, so the service cannot list or read it; nocopy keeps Compose out of it.
      - type: volume
        source: papaia-audit-pgdata
        target: /var/lib/papaia-audit/db-volume
        read_only: true
        volume:
          nocopy: true
    read_only: true
    depends_on:
      papaia-audit-schema:
        condition: service_completed_successfully
    healthcheck:
      # Asks the kernel whether port 8443 (0x20FB) has a listener (state 0A).
      test: ["CMD-SHELL", "grep -qiE ':20FB [0-9A-F:]+ 0A ' /proc/net/tcp /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - papaia-audit-net
      - papaia-audit-ingest-net
      # Keycloak alone, for the permission report (K-21).
      - papaia-audit-idp-net
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels:
      de.fidonis.module: papaia-audit
      de.fidonis.role:   audit
    profiles: [audit]

secrets:
  audit_db_owner_password:
    file: ${PAPAIA_CONFIG_DIR}/infra/audit/secrets/db-owner-password
  audit_db_ingest_password:
    file: ${PAPAIA_CONFIG_DIR}/infra/audit/secrets/db-ingest-password
  audit_db_read_password:
    file: ${PAPAIA_CONFIG_DIR}/infra/audit/secrets/db-read-password
  audit_db_retention_password:
    file: ${PAPAIA_CONFIG_DIR}/infra/audit/secrets/db-retention-password
  # Role audit_hold: the two-person deletion lock of the read API, nothing else.
  audit_db_hold_password:
    file: ${PAPAIA_CONFIG_DIR}/infra/audit/secrets/db-hold-password
  audit_heads_key:
    file: ${PAPAIA_CONFIG_DIR}/infra/audit/secrets/heads-signing-key
  # Key of the pseudonyms the read API shows instead of persons and the SIEM export
  # sends; only papaia-audit holds it.
  audit_pseudonym_key:
    file: ${PAPAIA_CONFIG_DIR}/infra/audit/secrets/pseudonym-key

networks:
  # Only papaia-audit and its database.
  papaia-audit-net:
    driver: bridge
    internal: true
  # papaia-audit and the audit sources; no route out.
  papaia-audit-ingest-net:
    driver: bridge
    internal: true
  # papaia-audit and Keycloak alone: the report account reads the realm; no route out.
  papaia-audit-idp-net:
    driver: bridge
    internal: true

volumes:
  papaia-audit-pgdata:
