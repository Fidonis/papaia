# ═══════════════════════════════════════════════════════════════════════════
# papAIa — Account lifecycle · papaia-lifecycle
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
#
# OPTIONAL — profile `lifecycle` (docs/lifecycle.md). Needs the bundled Keycloak
# (profile `keycloak`); the realm sync sets up the service account
# svc-papaia-lifecycle while the profile is active.
#
# What it does: when an account of the papaia realm is deactivated or deleted, it
# ends the person's sessions, removes every consent (offline sessions, delegations)
# and puts the person on the signed revocation list, which modules read from the
# volume papaia-security-state. The list is issued again every 15 s. At start and
# every hour it also reconciles without events (missed or expired events, directories
# behind Keycloak) and after a longer outage ends every delegation (gap revoke). Every
# deactivation, deletion, removed role or group, ended session and reset credential
# is one line of the erasure journal `identity` at the backup target, so that a
# restored snapshot cannot bring it back (docs/lifecycle.md).
#
# Safety:
#   - No port is published. The only network is papaia-lifecycle-net (internal),
#     shared with keycloak alone.
#   - Signs in with private_key_jwt; the key is mounted read-only from
#     $PAPAIA_CONFIG_DIR/security/service-accounts/svc-papaia-lifecycle.
#   - The signing key of the list lives in papaia-lifecycle-key, which backups
#     leave out. Only this service writes papaia-security-state.
#   - Of the backup target it sees erasure-journal/ alone; the installation key
#     erasure-hmac is mounted read-only. `render` makes the key, and the folder once
#     per backup target; it never makes the target itself, and once the folder was
#     made, a missing one (an unmounted target) stops `render` (docs/lifecycle.md).
#   - Runs as the user that owns the config dir, read-only, without capabilities.
#
# Variable paths (docs/configuration.md): ${VAR} below resolves from src/.env.
services:

  # Hands the two named volumes to the unprivileged user of the service; runs before
  # every start of papaia-lifecycle and must succeed again on volumes it handed over.
  papaia-lifecycle-init:
    image: python:3.12.16-slim-trixie@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    restart: "no"
    user: "0:0"
    # The mode is set only while root still owns a folder (a fresh volume): after the
    # chown, root would need CAP_FOWNER to change it, and the mode is already set.
    # The chown itself is repeated on every run, so a changed UID/GID takes effect.
    command:
      - sh
      - -c
      - >-
        for spec in /var/lib/papaia-lifecycle:0700 /var/lib/papaia-security-state:0755; do
        dir=$${spec%:*}; mode=$${spec#*:};
        if [ "$$(stat -c %u "$$dir")" = 0 ]; then chmod "$$mode" "$$dir" || exit 1; fi;
        done &&
        chown ${UID:-1000}:${GID:-1000} /var/lib/papaia-lifecycle /var/lib/papaia-security-state
    volumes:
      - type: volume
        source: papaia-lifecycle-key
        target: /var/lib/papaia-lifecycle
      - type: volume
        source: papaia-security-state
        target: /var/lib/papaia-security-state
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    labels:
      de.fidonis.module: papaia-lifecycle
      de.fidonis.role:   init
    profiles: [lifecycle]

  papaia-lifecycle:
    # The core's own image (Dockerfile next to this file, compat/own-images.yaml): one
    # standard-library Python file on a pinned Python base, which brings the openssl
    # command line (Ed25519, ES256). Built, signed and pinned by tools/build-images.
    image: ghcr.io/fidonis/papaia-lifecycle:1.10.0-rc.1@sha256:3be6fe9daa56bb8f0d5aba9a3acb6a341d8b89544ffbade4ce124c2aeab84082
    restart: unless-stopped
    depends_on:
      papaia-lifecycle-init:
        condition: service_completed_successfully
    command:
      - python3
      - -I
      - /opt/papaia-lifecycle/lifecycle.py
      - run
      - --keycloak-url=https://keycloak:8443
      - --ca-file=/etc/papaia-lifecycle/local-ca.crt
      - --account-dir=/run/papaia-lifecycle/account
      - --key-dir=/var/lib/papaia-lifecycle
      - --state-dir=/var/lib/papaia-security-state
      - --journal-dir=/var/lib/papaia-backup/erasure-journal
      - --journal-local-dir=/var/lib/papaia-lifecycle/erasure-journal
      - --erasure-key=/run/papaia-lifecycle/erasure-hmac
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/certs/local-ca.crt
        target: /etc/papaia-lifecycle/local-ca.crt
        read_only: true
        bind:
          create_host_path: false
      # The folder, not the file: a rotation replaces the key file atomically.
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/security/service-accounts/svc-papaia-lifecycle
        target: /run/papaia-lifecycle/account
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/security/erasure-hmac
        target: /run/papaia-lifecycle/erasure-hmac
        read_only: true
        bind:
          create_host_path: false
      # The journal folder of the backup target, written by this service alone among
      # the core services. Compose must not create it: an empty folder in place of an
      # unmounted target would look like an empty journal, so the container does not
      # start while it is missing.
      - type: bind
        source: ${PAPAIA_BACKUP_DIR}/erasure-journal
        target: /var/lib/papaia-backup/erasure-journal
        bind:
          create_host_path: false
      # Also holds the local copy of the journal (erasure-journal/), not backed up.
      - type: volume
        source: papaia-lifecycle-key
        target: /var/lib/papaia-lifecycle
      - type: volume
        source: papaia-security-state
        target: /var/lib/papaia-security-state
    # openssl reads messages and signatures from files.
    tmpfs:
      - /tmp:size=1m,mode=1777
    read_only: true
    healthcheck:
      test:
        - CMD
        - python3
        - -I
        - /opt/papaia-lifecycle/lifecycle.py
        - health
        - --key-dir=/var/lib/papaia-lifecycle
        - --state-dir=/var/lib/papaia-security-state
        - --journal-dir=/var/lib/papaia-backup/erasure-journal
        - --journal-local-dir=/var/lib/papaia-lifecycle/erasure-journal
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - papaia-lifecycle-net
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels:
      de.fidonis.module: papaia-lifecycle
      de.fidonis.role:   lifecycle
    profiles: [lifecycle]

networks:
  # Admin API of Keycloak and nothing else: no route out, no other service.
  papaia-lifecycle-net:
    driver: bridge
    internal: true

volumes:
  # Signing key, state and local journal copy of the service; never backed up
  # (lib/backup.py).
  papaia-lifecycle-key:
  # The revocation list for the modules, which mount it read-only.
  papaia-security-state:
