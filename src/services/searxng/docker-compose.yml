# Log rotation for every service (json-file, at most 5 x 10 MiB per container; README
# "Logs and log rotation").
x-papaia-logging: &papaia-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  searxng:
    logging: *papaia-logging
    image: searxng/searxng:2026.7.10-6a4d5148d@sha256:4ebe6ab0297397426fe7ca015caab8f5ed3b50784cf968bfbda7887ea6b16f6e
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - searxng_config:/etc/searxng
      - searxng_data:/var/cache/searxng
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/services/searxng/settings.yml
        target: /etc/searxng/settings.yml
    # Internal-only: reachable via Docker network only
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-searxng
      de.fidonis.role:   search-engine
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: [librechat-websearch]

# Volumes mounted on Windows: \\wsl.localhost\docker-desktop\mnt\docker-desktop-disk\data\docker\volumes
# Volumes mounted on Linux: /var/lib/docker/volumes
volumes:
  searxng_config:
  searxng_data:
