# ═══════════════════════════════════════════════════════════════════════════
# papAIa — papaia-manager · Extension Management UI
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
#
# OPTIONAL — activate with profile `manager`:
#   COMPOSE_PROFILES=...,manager   OR   papaia-ctl setup --manager-host=URL
#
# Path-parity requirement: PAPAIA_WORKSPACE_DIR, PAPAIA_CONFIG_DIR and
# PAPAIA_BACKUP_DIR MUST be identical on the host and inside the container.
# The manager imports lib.* directly from ${PAPAIA_WORKSPACE_DIR}/papaia/tools
# — not from a bundled copy — so the mounted path must match the actual host
# path, and every path it forwards to papaia-ctl must resolve the same way on
# both sides.
#
# Authentication: native OIDC in the FastAPI backend.  No oauth2-proxy
# sidecar (arch doc §3).  The manager registers as OIDC client `papaia-manager`
# in the papaia realm.
services:
  papaia-manager:
    image: ghcr.io/fidonis/papaia-manager:1.0.0
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Root-env vars resolved via docker compose ${VAR} expansion.
      # MANAGER_OIDC_CLIENT_SECRET and MANAGER_SESSION_SECRET are loaded
      # exclusively through env_file (environment: wins over env_file, so
      # listing them here would blank them out via empty ${VAR} resolution).
      #
      # The manager reads the three OIDC endpoints under OIDC_ISSUER_KC_*
      # (browser-side auth URL; server-side token + certs URLs on the internal
      # keycloak:8443 DNS name). The core exposes the same values under its
      # canonical OIDC_*_URL names, so translate here.
      OIDC_ISSUER_KC_AUTH:  ${OIDC_AUTH_URL}
      OIDC_ISSUER_KC_TOKEN: ${OIDC_TOKEN_URL}
      OIDC_ISSUER_KC_CERTS: ${OIDC_JWKS_URL}
      AUTH_PROVIDER:        ${AUTH_PROVIDER}
      MANAGER_OIDC_CLIENT_ID: papaia-manager
      MANAGER_HOST:         ${MANAGER_PUBLIC_URL}
      PAPAIA_CONFIG_DIR:    ${PAPAIA_CONFIG_DIR}
      PAPAIA_WORKSPACE_DIR: ${PAPAIA_WORKSPACE_DIR}
      PAPAIA_BACKUP_DIR:    ${PAPAIA_BACKUP_DIR}
      # Trust the local CA cert generated by papaia-ctl setup.  Cleared to ""
      # via docker-compose.ssl-cert.override.yml when AUTH_PROVIDER=external_oidc.
      SSL_CERT_FILE:        /certs/local-ca.crt
    ports:
      - "${HOST_IP:-0.0.0.0}:${MANAGER_EXT_PORT:-8120}:8000"
    volumes:
      # docker.sock: required for papaia-ctl compose operations
      - /var/run/docker.sock:/var/run/docker.sock
      # Path-parity mounts: host path === container path (lib.* import + ctl subprocess)
      - ${PAPAIA_WORKSPACE_DIR}:${PAPAIA_WORKSPACE_DIR}
      - ${PAPAIA_CONFIG_DIR}:${PAPAIA_CONFIG_DIR}
      # Backup location, so the manager can read the restore-point catalogue and
      # hand the same path to `papaia-ctl backup|restore --backup-dir`. With the
      # derived default (${PAPAIA_WORKSPACE_DIR}/backup) this nests inside the
      # workspace mount and changes nothing; it matters when setup was run with
      # --backup-dir pointing at a separate disk.
      - ${PAPAIA_BACKUP_DIR}:${PAPAIA_BACKUP_DIR}
      # CA certificate for internal TLS
      - ${PAPAIA_CONFIG_DIR}/certs:/certs:ro
    # The container runs as the non-root 'app' user which has no membership
    # in the docker.sock group.  DOCKER_GID must match the GID that owns
    # /var/run/docker.sock on the host.  Discover it with:
    #   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock alpine \
    #     stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    # Run as the host user so write access to PAPAIA_CONFIG_DIR and
    # PAPAIA_WORKSPACE_DIR (bind-mounted host paths) matches the owner set by
    # papaia-ctl setup.  UID/GID are stamped into the root .env at setup time.
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - papaia-net
    security_opt: [no-new-privileges:true]
    labels:
      de.fidonis.module: papaia-manager
      de.fidonis.role:   addon-manager
    profiles: [manager]
