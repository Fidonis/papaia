# ═══════════════════════════════════════════════════════════════════════════
# papAIa — Voice · local speech-to-text and text-to-speech
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
#
# OPTIONAL — activate with profile `voice`:
#   COMPOSE_PROFILES=...,voice   OR   papaia-ctl setup --voice
#
# Three services form one module (label `de.fidonis.module: papaia-voice`):
#
#   speaches            Whisper speech-to-text, OpenAI /v1/audio/transcriptions
#   speaches-model-init one-shot: installs the Whisper model over the API
#   chatterbox          Chatterbox Multilingual text-to-speech, /v1/audio/speech
#
# Neither engine publishes a host port: LiteLLM fronts both as the models
# `voice-stt` and `voice-tts` (see integration/ai/litellm/config.yaml), which
# makes them usable outside LibreChat with a LiteLLM virtual key, and
# LibreChat's speech panel goes through LiteLLM as well
# (integration/ai/librechat/librechat.yaml).
#
# First start downloads the models from huggingface.co into named volumes
# (~1.6 GB Whisper via the init container, ~3.2 GB Chatterbox by the server
# itself); later starts are offline. See the README section "Voice" for
# air-gapped installations.
#
# Variable paths (docs/configuration.md): ${VAR} below resolves from src/.env
# merged with ai/voice/.env. Both services take their values only through
# environment:, never env_file: — enabling the profile by editing
# COMPOSE_PROFILES by hand must not fail on a .env that setup has not
# seeded yet.
services:

  # ═══════════════════════════════════════════════════════════════════════════
  #  SPEECH-TO-TEXT — speaches (faster-whisper)
  #
  #  Models are loaded per request (the caller names the model id) and unloaded
  #  WHISPER__TTL seconds after the last use, so memory is only held while
  #  someone is dictating. The engine serves only models installed through its
  #  API (a request for any other id is a 404) — speaches-model-init below
  #  installs the configured one.
  #
  #  API_KEY guards every route, /health included — the MCP-rendering
  #  playwright service and other containers share papaia-net, and an open
  #  transcription endpoint would accept audio from any of them.
  # ═══════════════════════════════════════════════════════════════════════════
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    restart: unless-stopped
    environment:
      API_KEY:                  ${VOICE_API_KEY}
      # int8 halves the memory of the default compute type at no noticeable
      # quality loss on Whisper; see ai/voice/.env for the model choice.
      WHISPER__COMPUTE_TYPE:    ${VOICE_STT_COMPUTE_TYPE:-int8}
      # 0 = all cores. Cap this on a host that shares cores with the LLM stack.
      WHISPER__CPU_THREADS:     ${VOICE_STT_CPU_THREADS:-0}
      WHISPER__TTL:             ${VOICE_STT_MODEL_TTL:-300}
      ENABLE_UI:                "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      # The Xet transfer path has proven flaky (TLS resets mid-download leave
      # sparse, unloadable model files); the plain CDN path resumes cleanly.
      HF_HUB_DISABLE_XET:       "1"
      LOG_LEVEL:                ${VOICE_STT_LOG_LEVEL:-info}
    volumes:
      - speaches-hf-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      # /health sits behind the same bearer auth as every other route. An empty
      # API_KEY would start speaches with auth DISABLED (the profile was enabled
      # by hand before setup seeded ai/voice/.env), so the check fails first on
      # the missing key — an open engine must show up as unhealthy, not as fine.
      test: ["CMD-SHELL", "[ -n \"$$API_KEY\" ] && curl -fsS -H \"Authorization: Bearer $$API_KEY\" http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: ${VOICE_STT_HEALTHCHECK_START_PERIOD:-30s}
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-voice
      de.fidonis.role:   stt
    profiles: [voice]

  # One-shot helper: installs the transcription model through the engine's API
  # once speaches is healthy, then exits. Re-runs on an already installed model
  # return within seconds, and an interrupted download is resumed, so the
  # container is harmless on every later `start`. Mirrors localai-model-init.
  # The model id must match what the LiteLLM route voice-stt sends — see
  # integration/ai/litellm/config.yaml.
  speaches-model-init:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      speaches:
        condition: service_healthy
    environment:
      VOICE_API_KEY:   ${VOICE_API_KEY}
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        model=$$(printf '%s' "$$VOICE_STT_MODEL" | sed 's|/|%2F|g')
        attempt=1
        while [ "$$attempt" -le 8 ]; do
          code=$$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $$VOICE_API_KEY" \
            "http://speaches:8000/v1/models/$$model") || code=000
          if [ "$$code" = "200" ] || [ "$$code" = "201" ]; then
            cat /tmp/out; echo; exit 0
          fi
          echo "installing $$VOICE_STT_MODEL returned HTTP $$code (attempt $$attempt/8); retrying in 30s" >&2
          cat /tmp/out >&2 2>/dev/null || true
          attempt=$$((attempt + 1))
          sleep 30
        done
        echo "giving up installing $$VOICE_STT_MODEL" >&2
        exit 1
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-voice
      de.fidonis.role:   stt-model-init
    profiles: [voice]

  # ═══════════════════════════════════════════════════════════════════════════
  #  TEXT-TO-SPEECH — Chatterbox Multilingual (Chatterbox-TTS-Server)
  #
  #  The model stays resident once loaded (~4-6 GB, and the LOAD peak exceeds
  #  6 GB), hence the memory limit: an out-of-memory kill must hit this
  #  container, not the host's OOM killer picking a database. The server is
  #  configured only through the mounted config.yaml (it reads no environment
  #  variables); the file is rendered from ai/voice/chatterbox.yaml, so edits
  #  belong in the overlay, and a changed config reaches the server when the
  #  container is restarted. The mount is READ-ONLY on purpose: the server
  #  would otherwise persist UI state — and, the API being unauthenticated,
  #  anything a caller posts to its settings endpoints — into the rendered
  #  file on the host. Saving settings through its web UI therefore fails,
  #  which is acceptable: the UI is unreachable from outside papaia-net and
  #  unused.
  #
  #  The image has no auth option (its auth settings are unused upstream), so
  #  this service relies on being internal-only — the trade-off and the
  #  voice-cloning surface are documented in ADR 0011.
  # ═══════════════════════════════════════════════════════════════════════════
  chatterbox:
    image: ghcr.io/devnen/chatterbox-tts-server:sha-915ae28-cpu@sha256:848adb0dce2f0274bad4214a056320a0c8c32d82267e717a4caeffce7169a4e3
    # The upstream CPU image is published for linux/amd64 only. Declared so an
    # ARM host (Apple Silicon under Docker Desktop) runs it under emulation
    # instead of failing the pull with "no matching manifest".
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: ${VOICE_TTS_MEM_LIMIT:-8g}
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      # Same rationale as on speaches: the Xet path breaks mid-download.
      HF_HUB_DISABLE_XET:       "1"
    volumes:
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/ai/voice/chatterbox.yaml
        target: /app/config.yaml
        read_only: true
      - chatterbox-hf-cache:/app/hf_cache
    # The bundled chatterbox package cannot load the multilingual checkpoints
    # on a machine without CUDA: two of its torch.load calls lack a
    # map_location, and the published checkpoints carry CUDA storages (fix PR
    # unmerged when the upstream repo was archived; the server's own fork has
    # not picked it up either). Until a fixed image exists, start the server
    # through a wrapper that maps CUDA-saved tensors onto the CPU; with CUDA
    # available the wrapper changes nothing. Replaces the image CMD
    # ["python3", "server.py"].
    command:
      - python3
      - -c
      - |
        import torch
        if not torch.cuda.is_available():
            _load = torch.load
            def _cpu_load(*args, **kwargs):
                kwargs.setdefault("map_location", "cpu")
                return _load(*args, **kwargs)
            torch.load = _cpu_load
        import runpy
        runpy.run_path("server.py", run_name="__main__")
    healthcheck:
      # No curl in the image and no /health route; the voices listing is the
      # cheapest request that proves the app is serving.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/v1/audio/voices', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      # The first start downloads ~3.2 GB of model weights and then loads them;
      # on a slow line this takes well over ten minutes, so the health budget
      # (start_period + retries x interval = ~25 min) covers that worst case.
      retries: 40
      start_period: ${VOICE_TTS_HEALTHCHECK_START_PERIOD:-300s}
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-voice
      de.fidonis.role:   tts
    profiles: [voice]

volumes:
  speaches-hf-cache:
  chatterbox-hf-cache:
