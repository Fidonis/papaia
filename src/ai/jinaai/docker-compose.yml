services:
  jina-reranker-api:
    image: ghcr.io/fidonis/jina-reranker-api:0.1.2
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      API_KEY:           ${JINAAI_RERANKER_API_KEY}
      RERANKER_BASE_URL: ${LITELLM_BASE_URL}
      RERANKER_API_KEY:  ${LITELLM_API_KEY}
      RERANKER_MODEL:    ${RERANKER_MODEL}
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-jinaai
      de.fidonis.role:   reranker
    healthcheck:
      # The image ships neither wget nor curl — probe with the bundled Python
      # interpreter instead.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles: [librechat-websearch]
