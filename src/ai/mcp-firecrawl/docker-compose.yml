# ═══════════════════════════════════════════════════════════════════════════
# papAIa — MCP Firecrawl · MCP interface to local Firecrawl
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
#
#  Exposes Firecrawl's crawl, scrape, search, map, and extract capabilities
#  as MCP tools so users can invoke them directly in LibreChat.
#
#  Security boundary: internal Docker network only (no external port binding).
#  No OIDC authentication required — only containers on papaia-net can reach
#  this service.
#
#  Requires:
#    - MCP_FIRECRAWL_IMAGE in root .env
#    - firecrawl service running (profile: librechat-websearch) on papaia-net
# ═══════════════════════════════════════════════════════════════════════════
# Log rotation for every service (json-file, at most 5 x 10 MiB per container; README
# "Logs and log rotation").
x-papaia-logging: &papaia-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mcp-firecrawl:
    logging: *papaia-logging
    image: ghcr.io/firecrawl/firecrawl-mcp-server@sha256:d9015c8ced7fc4c7186e8c07d8cae206803252c381992534f05e4e15242f2164
    # Upstream publishes this image for linux/amd64 only. Pinning the platform lets an
    # arm64 host run it emulated (Rosetta on Docker Desktop, QEMU/binfmt on Linux arm64)
    # instead of failing the pull. Drop it once a multi-arch image exists.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-http://firecrawl:3002}
      FIRECRAWL_API_KEY: "sk-not-used"
      # Without this the process starts in stdio mode and serves no HTTP at all.
      HTTP_STREAMABLE_SERVER: "true"
      # The image runs Node.js directly, with no reverse proxy in front of it.
      # It has to listen on all interfaces so LibreChat can reach it over
      # papaia-net; the port is pinned because librechat.yaml and the
      # healthcheck depend on it.
      HOST: "0.0.0.0"
      PORT: "3000"
      # The server rejects any Host header it does not know (DNS-rebinding
      # protection, answers 403). LibreChat calls it by its service name.
      FIRECRAWL_MCP_ALLOWED_HOSTS: "mcp-firecrawl"
    networks:
      - papaia-net
    healthcheck:
      # /mcp only accepts POST (GET returns 405), so probe /health. The image
      # ships busybox wget but no curl.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      de.fidonis.module: papaia-mcp-firecrawl
      de.fidonis.role:   mcp-server
    profiles: [librechat-websearch]
