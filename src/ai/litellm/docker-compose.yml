services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.108.3@sha256:f14d0a035d84d1a8bc98538faf5999e456641fd4cfa191822fd4be1934c1f4f6
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: "postgresql://llmproxy:${LITELLM_PG_PASSWORD}@litellm-db:5432/litellm"
      SSL_CERT_FILE: /tmp/ca-bundle.crt
      # Use the model cost map bundled in the image; without it LiteLLM fetches
      # the map from the internet at every start (docs/hosted-test-model.md).
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/ai/litellm/config.yaml
        target: /app/config.yaml
      # Code, not operator config, hence mounted from the repo and not
      # rendered: LiteLLM resolves the callback module registered in
      # config.yaml against the config file's directory.
      - type: bind
        source: ./papaia_hooks.py
        target: /app/papaia_hooks.py
        read_only: true
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/certs
        target: /certs
        read_only: true
      # The platform halt (docs/halt.md): the folder, never the file, which is replaced
      # by a rename. `render` makes it; Compose must not.
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/state
        target: /run/papaia-halt
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "python -c 'import certifi,shutil; shutil.copy(certifi.where(), \"/tmp/ca-bundle.crt\")' && cat /certs/local-ca.crt >> /tmp/ca-bundle.crt && exec litellm --config=/app/config.yaml"
    depends_on:
      litellm-db:
        condition: service_healthy
    # No host port: served by the edge proxy (or an external one, papaia-ctl proxy list).
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-litellm
      de.fidonis.role:   llm-proxy
    profiles: [litellm]

  litellm-db:
    image: postgres:16.16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${LITELLM_PG_PASSWORD}
    volumes:
      - litellm-postgresql:/var/lib/postgresql/data
    # Port not exposed — use: docker exec -it <container> psql -U llmproxy litellm
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-litellm
      de.fidonis.role:   database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    profiles: [litellm]

  litellm-prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - litellm-prometheus:/prometheus
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/ai/litellm/prometheus.yml
        target: /etc/prometheus/prometheus.yml
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "printf '%s' $$LITELLM_MASTER_KEY > /etc/prometheus/litellm-token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d"
    # Port not exposed — access via NPM reverse proxy with auth if needed
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-litellm
      de.fidonis.role:   metrics
    profiles: [litellm]

# Volumes mounted on Windows: \\wsl.localhost\docker-desktop\mnt\docker-desktop-disk\data\docker\volumes
# Volumes mounted on Linux: /var/lib/docker/volumes
volumes:
  litellm-postgresql:
  litellm-prometheus:
