# ═══════════════════════════════════════════════════════════════════════════
# papAIa — LiteLLM · Proxy Configuration
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
# LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL are set via .env.
# No models are shipped by default. Models come from the LocalAI profile and
# the overlay (see "Models" below), teams from the Admin UI. A model added in
# the Admin UI bypasses the check of the render (docs/hosted-test-model.md).

general_settings:
  ui_access_mode: "sso_only"
  store_model_in_db: true        # allow adding models via Admin UI
  allow_user_auth: true          # users can log in via SSO and get personal keys
  # The gateway stores no contents (docs/model-gateway.md): spend logs keep usage
  # counts per key, never the prompt or the answer. The render refuses a layer that
  # changes this or the two settings below, any callback but the three registered
  # under litellm_settings.callbacks, response caching outside the process and alerting.
  store_prompts_in_spend_logs: false

litellm_settings:
  drop_params: true              # ignore unknown/unsupported params silently
  num_retries: 2
  request_timeout: 600
  turn_off_message_logging: true   # no messages or responses to any logger
  redact_user_api_key_info: true   # no key or user details in logs and callbacks
  # prometheus exposes /metrics for scraping. papaia_hooks (mounted next to
  # this file) hides deployments marked `model_info: {discoverable: false}`
  # from the model listings for every key — LiteLLM's own flag spares admin
  # keys, and the key LibreChat holds is the master key, so non-chat routes
  # (the voice profile's audio routes) would otherwise show up as selectable
  # chat models. Hidden routes stay fully callable. papaia_platform_halt refuses
  # every request of every key while the platform halt is active (docs/halt.md).
  callbacks:
    - "prometheus"
    - "papaia_hooks.papaia_listing_filter"
    - "papaia_hooks.papaia_platform_halt"

router_settings:
  routing_strategy: least-busy  # prefer least-loaded model replica

# ── Teams ──────────────────────────────────────────────────────────────────
# Teams are created and managed in the Admin UI (Settings → Teams).
# Recommended starting setup:
#   • "admins"  — no budget limit, all models, manage API keys
#   • "users"   — monthly budget limit, chat models only
#
# Per-user budgets and rate limits can be set under Settings → Users.

# ── Models ─────────────────────────────────────────────────────────────────
# Modules use aliases only: the render adds papaia-chat and papaia-structured,
# mapped onto the model PAPAIA_DEFAULT_MODEL names, and papaia-embed, mapped onto
# PAPAIA_DEFAULT_EMBED_MODEL (root .env; `setup --local-ai` names the shipped
# default model). An overlay entry with an alias's name replaces the generated one.
# Each module calls with a key of its own that reaches its aliases only
# (docs/model-gateway.md).
#
# With the localai module on, every LocalAI model that models.txt downloads
# and that a model YAML in ai/localai/models/ describes is added to this list
# when the configuration is rendered, under the YAML's name. The entries send
# LOCALAI_API_KEY (litellm/.env, copied from ai/localai/.env during setup); the
# key itself is never written here. An overlay entry with the same model_name
# replaces the generated one.
#
# Other models are added through an overlay of this file
# ($PAPAIA_CONFIG_DIR/overlay/ai/litellm/config.yaml) with `api_key:
# os.environ/<VAR>` and the variable in litellm/.env. Their api_base must name
# a service the stack defines (a compose service of an active profile or
# add-on, such as http://localai:8080/v1), their provider must be one that
# sends to api_base only (openai/, hosted_vllm/, ollama/ ...), and they may
# name no other endpoint. The render refuses every other route unless the test
# stack switched the hosted test model on (docs/hosted-test-model.md). Do not
# register a generated name in the Admin UI as well: LiteLLM would split the
# traffic between both entries.
#
# The LibreChat RAG API embeds with the model named in RAG_EMBEDDINGS_MODEL
# (ai/librechat/.env, default nomic-embed-text). Activate its line in the
# LocalAI models.txt, register a model under that name or change the variable.

model_list: []

  # ── Hosted model: test stack only (docs/hosted-test-model.md) ─────────────
  # Without PAPAIA_TEST_EXTERNAL_MODEL=1 in $PAPAIA_CONFIG_DIR/.env the render
  # refuses this entry. Put it into the overlay, replace the model id and the
  # host with the provider's, and keep TEST_HOSTED_API_KEY only in
  # $PAPAIA_CONFIG_DIR/ai/litellm/test-hosted.env (mode 0600), never in
  # ai/litellm/.env, which every backup carries.
  # >>> hosted example
  # - model_name: test-hosted-chat
  #   litellm_params:
  #     model: openai/reference-chat
  #     api_base: https://api.example.com/v1
  #     api_key: os.environ/TEST_HOSTED_API_KEY
  # <<< hosted example
