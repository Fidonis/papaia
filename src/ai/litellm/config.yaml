# LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL are set via .env.
# No models are shipped by default. Add models and teams in the Admin UI.

general_settings:
  ui_access_mode: "sso_only"
  store_model_in_db: true        # allow adding models via Admin UI
  allow_user_auth: true          # users can log in via SSO and get personal keys

litellm_settings:
  drop_params: true              # ignore unknown/unsupported params silently
  num_retries: 2
  request_timeout: 600
  callbacks: ["prometheus"]     # expose /metrics for Prometheus scraping

router_settings:
  routing_strategy: least-busy  # prefer least-loaded model replica

# ── Teams ──────────────────────────────────────────────────────────────────
# Teams are created and managed in the Admin UI (Settings → Teams).
# Recommended starting setup:
#   • "admins"  — no budget limit, all models, manage API keys
#   • "users"   — monthly budget limit, chat models only
#
# Per-user budgets and rate limits can be set under Settings → Users.

# ── Models ─────────────────────────────────────────────────────────────────
# No models are shipped by default. A model registered here without a usable
# backend (missing .gguf download, missing API key) only fails on first use, so
# the operator adds the models that are actually available.
#
# Add models via Admin UI → Models, so that API keys are stored in the
# database and not in this file. The examples below can be used instead:
# replace `model_list: []` with `model_list:`, uncomment the entries you need
# and set the API keys in litellm/.env.
#
# Other services refer to these model names:
#   • qwen2.5-1.5b-instruct — LibreChat memory agent (ai/librechat/librechat.yaml)
#   • nomic-embed-text      — LibreChat RAG API (EMBEDDINGS_MODEL in
#                             ai/librechat/docker-compose.yml)
# Register models under these names or change the references there.

model_list: []

  # ── LocalAI — available when LocalAI service is running ──────────────────
