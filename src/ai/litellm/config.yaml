# ═══════════════════════════════════════════════════════════════════════════
# LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL are set via .env.
# No models are shipped by default. Add models and teams in the Admin UI.

general_settings:
  ui_access_mode: "sso_only"
  store_model_in_db: true        # allow adding models via Admin UI
  allow_user_auth: true          # users can log in via SSO and get personal keys

litellm_settings:
  drop_params: true              # ignore unknown/unsupported params silently
  num_retries: 2
  request_timeout: 600
  callbacks: ["prometheus"]     # expose /metrics for Prometheus scraping

router_settings:
  routing_strategy: least-busy  # prefer least-loaded model replica

# ── Teams ──────────────────────────────────────────────────────────────────
# Teams are created and managed in the Admin UI (Settings → Teams).
# Recommended starting setup:
#   • "admins"  — no budget limit, all models, manage API keys
#   • "users"   — monthly budget limit, chat models only
#
# Per-user budgets and rate limits can be set under Settings → Users.

# ── Models ─────────────────────────────────────────────────────────────────
# With the localai module on, every LocalAI model that models.txt downloads
# and that a model YAML in ai/localai/models/ describes is added to this list
# when the configuration is rendered, under the YAML's name. The entries send
# LOCALAI_API_KEY (litellm/.env, copied from ai/localai/.env during setup); the
# key itself is never written here. An overlay entry with the same model_name
# replaces the generated one.
#
# Other models are added in the Admin UI → Models, so that their API keys are
# stored in the database and not in this file, or through an overlay of this
# file ($PAPAIA_CONFIG_DIR/overlay/ai/litellm/config.yaml) with `api_key:
# os.environ/<VAR>` and the variable in litellm/.env. Do not register a
# generated name in the Admin UI as well: LiteLLM would split the traffic
# between both entries.
#
# The LibreChat RAG API embeds with the model named in RAG_EMBEDDINGS_MODEL
# (ai/librechat/.env, default nomic-embed-text). Activate its line in the
# LocalAI models.txt, register a model under that name or change the variable.

