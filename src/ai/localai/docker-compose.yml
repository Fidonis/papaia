# ═══════════════════════════════════════════════════════════════════════════
# papAIa — LocalAI · Local LLM Hosting
# by Fidonis GmbH · https://fidonis.de
# ═══════════════════════════════════════════════════════════════════════════
services:
  # ═══════════════════════════════════════════════════════════════════════════
  # LocalAI Model Init
  # ═══════════════════════════════════════════════════════════════════════════
  localai-model-init:
    image: curlimages/curl:latest
    user: "0"
    restart: "no"
    volumes:
      - localai-models:/models
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/ai/localai/models.txt
        target: /models-config/models.txt
        read_only: true
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/ai/localai/models
        target: /models-config/configs
        read_only: true
    entrypoint: sh
    command:
      - -c
      - |
        # Install model yaml configs into the volume so LocalAI can
        # discover them on startup. Idempotent: cp overwrites with the
        # current canonical config from ${PAPAIA_CONFIG_DIR}.
        cp /models-config/configs/*.yaml /models/ 2>/dev/null \
          && echo "[model-init] copied model yamls into /models/" \
          || echo "[model-init] no model yamls found in /models-config/configs"

        grep -v '^\s*#' /models-config/models.txt | grep -v '^\s*$$' | while IFS= read -r url; do
          filename=$$(basename "$$url")
          if test -f "/models/$$filename"; then
            echo "[model-init] $$filename already exists — skipped"
          else
            echo "[model-init] Downloading $$filename ..."
            curl -fL -o "/models/$$filename" "$$url" && echo "[model-init] $$filename done" || echo "[model-init] $$filename FAILED" >&2
          fi
        done
    networks:
      - papaia-net
    labels:
      de.fidonis.module: papaia-localai
      de.fidonis.role:   model-init
    profiles: [localai]

  # ═══════════════════════════════════════════════════════════════════════════
  # LocalAI
  # ═══════════════════════════════════════════════════════════════════════════
  localai:
    # CPU image. `papaia-ctl setup` rewrites this to the matching accelerator
    # tag (-gpu-nvidia-cuda-13, -gpu-intel, ...) via a generated override in
    # $PAPAIA_CONFIG_DIR/overrides/, reusing the version pinned right here.
    image: localai/localai:v4.7.1
    restart: unless-stopped
    ports:
      - "${HOST_IP:-0.0.0.0}:${LOCALAI_EXT_PORT}:8080"
    # Per-service variables (LOCALAI_OIDC_CLIENT_SECRET, log level, healthcheck
    # timings). LOCALAI_OIDC_CLIENT_SECRET must not appear in environment: below
    # or compose would override env_file with the empty root-env resolution.
    env_file:
      - ./.env
    environment:
      MODELS_PATH: /models
      LOCALAI_EXTERNAL_BACKENDS: "llama-cpp"
      # Enable the auth subsystem — without this flag LocalAI does not register
      # any auth routes (including /api/auth/oidc/login) regardless of other OIDC vars.
      LOCALAI_AUTH: "true"
      # Persist user accounts across container restarts (SQLite via localai-data volume)
      LOCALAI_AUTH_DATABASE_URL: /data/localai.db
      # Root-env vars: resolved from src/.env via docker compose ${VAR} expansion
      LOCALAI_OIDC_ISSUER: ${OIDC_ISSUER}
      LOCALAI_OIDC_CLIENT_ID: localai
      LOCALAI_BASE_URL: ${LOCALAI_PUBLIC_URL}
      # Trust the local CA cert generated by papaia-ctl setup (no-op in production
      # where Keycloak is behind a publicly trusted reverse proxy)
      SSL_CERT_FILE: /certs/local-ca.crt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      localai-model-init:
        condition: service_completed_successfully
      # OIDC discovery runs at startup via oidc.NewProvider — if Keycloak is not
      # healthy yet the discovery fails and /api/auth/oidc/login is never registered.
      keycloak:
        condition: service_healthy
        required: false
    volumes:
      - localai-models:/models
      - localai-data:/data
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/certs
        target: /certs
        read_only: true
    networks:
      - papaia-net
    healthcheck:
      # /v1/models is behind the auth subsystem once LOCALAI_AUTH is enabled and
      # answers 401 without credentials. /readyz is the unauthenticated
      # readiness endpoint LocalAI uses for its own image healthcheck.
      test: ["CMD-SHELL", "curl -f http://localhost:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: ${LOCALAI_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${LOCALAI_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${LOCALAI_HEALTHCHECK_RETRIES:-5}
      start_period: ${LOCALAI_HEALTHCHECK_START_PERIOD:-60s}
    labels:
      de.fidonis.module: papaia-localai
      de.fidonis.role:   inference-engine
    profiles: [localai]

volumes:
  localai-models:
  localai-data:
