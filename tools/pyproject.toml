[project]
name = "papaia-ctl"
version = "0.0.0"
description = "papaia-ctl orchestrator -- local dev tooling, not published"
requires-python = ">=3.12"
# The runtime set: papaia-ctl runs lib.cli from an environment of exactly these packages,
# built by `setup` and `upgrade` from runtime.lock (hash-pinned, exported from uv.lock).
dependencies = ["PyYAML>=6.0", "papaia-kit==0.1.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.18",
]

# The kit has no package index: its release wheel is vendored and pinned by sha256 in
# kit.lock, uv.lock and runtime.lock (tests/test_ci_checks.py keeps them in step).
[tool.uv.sources]
papaia-kit = { path = "vendor/papaia-kit/0.1.0/papaia_kit-0.1.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
