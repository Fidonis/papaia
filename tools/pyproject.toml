[project]
name = "papaia-ctl"
version = "0.0.0"
description = "papaia-ctl orchestrator -- local dev tooling, not published"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# papaia-kit runs the repository checks of the CI (licenses, words); it needs Python 3.12
# and is never part of papaia-ctl itself, which keeps running on Python 3.10.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.18",
    "papaia-kit==0.1.4 ; python_version >= '3.12'",
]

# The kit has no package index: its release wheel is vendored and pinned by sha256 in
# kit.lock and uv.lock (tests/test_ci_checks.py keeps the three in step).
[tool.uv.sources]
papaia-kit = { path = "vendor/papaia-kit/0.1.4/papaia_kit-0.1.4-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
