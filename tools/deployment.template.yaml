# papAIa deployment manifest — single source of truth for this installation.
#
# Generated by `papaia-ctl init`. `customer` and `platform_version` are
# seeded once and refreshed by `papaia-ctl setup`. `core.profiles` is kept
# in sync with the resolved COMPOSE_PROFILES in .env. The `extensions` list
# is updated by `papaia-ctl apps integrate/deintegrate` (not implemented
# yet -- no extensions exist for the lean core today). This file is
# hand-editable for anything papaia-ctl doesn't manage.

customer: papaia
platform_version: 0.0.0-dev
hosting: self-hosted

core:
  profiles:
    - keycloak
    - oauth2-proxy
    - nginx
    - librechat
    - litellm
  inference: local-first

extensions: []
