# papAIa deployment manifest — single source of truth for this installation.
#
# Generated by `papaia-ctl setup`. `customer` and `platform_version` are
# seeded once and refreshed on every subsequent `papaia-ctl setup` run. `core.profiles` is kept
# in sync with the resolved COMPOSE_PROFILES in .env. The `addons` list
# is managed by `papaia-ctl addon install/remove/uninstall`. This file is
# hand-editable for anything papaia-ctl doesn't manage.

customer: papaia
platform_version: 0.0.0-dev
hosting: self-hosted

# Addon-compatibility gate policy: `production`/`enforce` refuses to
# install or start incompatible addons (the default), `dev`/`warn` only
# warns. The PAPAIA_COMPAT_MODE env var overrides this per invocation.
# mode: production

core:
  profiles:
    - keycloak
    - oauth2-proxy
    - nginx
    - librechat
    - litellm
  inference: local-first

addons: []
