# Nginx Proxy Manager — Paperless-ngx proxy host configuration reference
#
# papaia-ctl creates this proxy host itself (npm-provision) while the add-on is
# active and PAPERLESS_PUBLIC_URL is a host name without a port. Use this file
# as a guide for an external proxy or a host you add by hand. Replace
# docs.example.com with the host name of PAPERLESS_PUBLIC_URL.
#
# Paperless trusts X-Papaia-Remote-User. It listens only on its container's
# loopback; paperless-gate (port 8001, reached as paperless:8001) is the only
# way in and passes a request only with the proxy's own secret in
# X-Papaia-Gate. The proxy therefore
#   - clears X-Papaia-Remote-User and X-Papaia-Gate on every request, and
#   - sets X-Papaia-Gate from its secret file, never from a value written here.
# The include holds `more_set_input_headers "X-Papaia-Gate: <secret>";`, which
# papaia-ctl writes to $PAPAIA_CONFIG_DIR/secrets/paperless-gate/proxy/nginx.conf
# and the proxy mounts read-only at /run/papaia/paperless-gate. Raw nginx needs
# the headers-more module for these directives.

server {
    listen 443 ssl;
    server_name docs.example.com;

    # TLS — managed by NPM or your own certificate provider
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    location / {
        more_clear_input_headers "X-Papaia-Remote-User" "X-Papaia-Gate";
        include /run/papaia/paperless-gate/nginx.conf;

        proxy_pass         http://paperless:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Status updates in the web UI use a websocket.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Required for Paperless file uploads
        client_max_body_size 100m;
    }
}
