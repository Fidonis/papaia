# Shards of the core test suite in CI (workflow "CI", job "pytest"). Every shard lists test
# file names or globs of tools/tests; the catch-all shard also takes every file no other
# shard names, so a new test file needs no entry here. A file may be in one shard only.
#
# The matrix of the job "pytest" in .github/workflows/ci.yml has one entry per shard with
# its timeout, address pool and tools. `python3 tests/shard_check.py check` (from tools/)
# proves that the shards together collect exactly the whole suite. To add a shard, add a
# table here and a matrix entry; see CONTRIBUTING.md ("Test shards in CI").
#
# Grouping: the slow files by subject, the Docker live files in three shards, the fast
# unit files in the catch-all shard. The seconds after each group are the measured sum of
# its files (full local run with --durations=0, 25 November 2026).

catch_all = "unit"

# 298 s
[shards.cluster]
files = ["test_cluster_data.py", "test_cluster.py"]

# 296 s
[shards.nodes]
files = [
  "test_nodes.py",
  "test_node_shell.py",
  "test_topology.py",
  "test_host_loss_restore.py",
  "test_legacy_migration.py",
]

